<!doctype html><html lang="en"><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;width:1320px;height:2868px;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display",BlinkMacSystemFont,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;position:relative}
h1{margin:0;font-weight:800}h1 span{display:block;white-space:nowrap}
body{background:radial-gradient(ellipse 900px 1300px at 50% 1750px,#E3FCEF 0%,#C6F8DF 70%);color:#0F2C22}
.brand{position:absolute;left:96px;right:96px;top:84px;display:flex;align-items:center;justify-content:space-between}
.brand b{display:flex;align-items:center;gap:20px;font-size:40px;font-weight:700;letter-spacing:-1px}

.brand span{font-size:25px;letter-spacing:3px;font-weight:600;color:#43665A}
.eyebrow{position:absolute;top:204px;left:98px;right:96px;font-size:28px;font-weight:700;letter-spacing:3.4px;color:#1C6B49}
h1{position:absolute;top:254px;left:90px;right:70px;font-size:142px;line-height:1.0;letter-spacing:-5.6px}
h1 span:last-child{color:#1C6B49}
.detail{position:absolute;left:98px;right:90px;top:560px;font-size:37px;line-height:1.3;letter-spacing:-.5px;color:#43665A;margin:0}
.rail{position:absolute;left:98px;top:690px;bottom:72px;border-left:2px solid #9ED5BA}
.rail::before{content:'';width:12px;height:12px;border-radius:50%;background:#1C6B49;position:absolute;left:-7px;top:0}
</style><body>
<div class="brand"><b><img src="../assets/icon.png">Minor AI</b><span>IDEAS INTO ACTION</span></div>

<div class="phone" style="position:absolute;left:170px;top:706px;width:980px;height:2073px;border-radius:156px;background:#050506;box-shadow:0 0 0 6px #2A2C31, 0 0 0 10px #8E939B, 0 0 0 13px #3B3E44, 0 62px 104px rgba(10,10,20,.28), 0 17px 25px rgba(10,10,20,.18)"><div style="position:absolute;left:-14px;top:342px;width:8px;height:73px;border-radius:4px;background:linear-gradient(90deg,#5d6168,#a3a8af 50%,#5d6168)"></div><div style="position:absolute;left:-14px;top:466px;width:8px;height:129px;border-radius:4px;background:linear-gradient(90deg,#5d6168,#a3a8af 50%,#5d6168)"></div><div style="position:absolute;left:-14px;top:622px;width:8px;height:129px;border-radius:4px;background:linear-gradient(90deg,#5d6168,#a3a8af 50%,#5d6168)"></div><div style="position:absolute;right:-14px;top:518px;width:8px;height:197px;border-radius:4px;background:linear-gradient(90deg,#5d6168,#a3a8af 50%,#5d6168)"></div><img src="../raw/mapdesign-travel.png" style="position:absolute;left:22px;top:22px;width:936px;height:2029px;border-radius:134px;display:block"></div><script>
// A headline line too long for the column shrinks both lines to the size that fits, so they stay even.
const lines = [...document.querySelectorAll('h1 span')];
let size = parseFloat(getComputedStyle(lines[0]).fontSize);
while (lines.some(l => l.scrollWidth > l.parentElement.clientWidth) && size > 60) { size -= 2; lines.forEach(l => l.style.fontSize = size + 'px'); }
</script></body></html>
