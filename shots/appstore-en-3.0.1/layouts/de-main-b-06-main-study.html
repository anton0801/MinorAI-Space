<!doctype html><html lang="de"><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;width:1320px;height:2868px;overflow:hidden}

h1{margin:0;font-weight:800}h1 span{display:block;white-space:nowrap}
body{background:#0C0912;color:#F6F3FA}
.bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 760px 900px at 50% 1500px,#5CB6FF38 0%,transparent 70%),
  radial-gradient(ellipse 900px 520px at 50% 120px,#5CB6FF1F 0%,transparent 75%),
  radial-gradient(circle,rgba(255,255,255,.075) 1.6px,transparent 2.2px) 0 0/44px 44px}
.brand{position:absolute;top:88px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;font-size:34px;font-weight:650;color:#CFC8DA}

.detail{position:absolute;left:90px;right:90px;top:556px;text-align:center;font-size:37px;line-height:1.3;color:#A79FB4;margin:0}
</style><body><div class="bg"></div>

<div class="phone" style="position:absolute;left:157px;top:690px;width:1006px;height:2127px;border-radius:160px;background:#050506;box-shadow:0 0 0 6px #2A2C31, 0 0 0 10px #8E939B, 0 0 0 13px #3B3E44, 0 64px 106px rgba(10,10,20,.28), 0 17px 26px rgba(10,10,20,.18), 0 0 252px #5CB6FF55"><div style="position:absolute;left:-15px;top:351px;width:8px;height:74px;border-radius:4px;background:linear-gradient(90deg,#5d6168,#a3a8af 50%,#5d6168)"></div><div style="position:absolute;left:-15px;top:479px;width:8px;height:132px;border-radius:4px;background:linear-gradient(90deg,#5d6168,#a3a8af 50%,#5d6168)"></div><div style="position:absolute;left:-15px;top:638px;width:8px;height:132px;border-radius:4px;background:linear-gradient(90deg,#5d6168,#a3a8af 50%,#5d6168)"></div><div style="position:absolute;right:-15px;top:532px;width:8px;height:202px;border-radius:4px;background:linear-gradient(90deg,#5d6168,#a3a8af 50%,#5d6168)"></div><img src="../raw-de/card-back.png" style="position:absolute;left:23px;top:23px;width:960px;height:2081px;border-radius:137px;display:block"></div><script>
// A headline line too long for the column shrinks both lines to the size that fits, so they stay even.
const lines = [...document.querySelectorAll('h1 span')];
let size = parseFloat(getComputedStyle(lines[0]).fontSize);
while (lines.some(l => l.scrollWidth > l.parentElement.clientWidth) && size > 60) { size -= 2; lines.forEach(l => l.style.fontSize = size + 'px'); }
</script></body></html>
