<!doctype html><html lang="es"><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;width:1320px;height:2868px;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display",BlinkMacSystemFont,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;position:relative}
h1{margin:0;font-weight:800}h1 span{display:block;white-space:nowrap}
body{background:#F4F1EA;color:#121212}
.brand{position:absolute;left:96px;top:86px;display:flex;align-items:center;gap:18px;font-size:36px;font-weight:700;letter-spacing:-.8px}
.brand img{width:58px;height:58px;border-radius:14px}
.eyebrow{position:absolute;top:204px;left:98px;display:flex;align-items:center;gap:16px;font-size:27px;font-weight:700;letter-spacing:3.2px;color:#0D9466}
.eyebrow::before{content:'';width:46px;height:5px;border-radius:3px;background:#0D9466}
h1{position:absolute;top:258px;left:90px;right:60px;font-size:150px;line-height:.98;letter-spacing:-6.4px}
h1 span:last-child{color:#0D9466}
.detail{position:absolute;left:98px;right:120px;top:570px;font-size:38px;line-height:1.3;color:#5B5750;margin:0}
.zoom{position:absolute;border-radius:44px;box-shadow:0 0 0 2px rgba(255,255,255,.10),0 50px 90px rgba(20,14,30,.38),0 14px 30px rgba(20,14,30,.22);z-index:3}
</style><body>
<div class="brand"><img src="../assets/icon.png">Minor AI</div>
<div class="eyebrow">LLUVIA DE IDEAS CON IA</div>
<h1><span>¿Sin ideas?</span><span>La IA te ayuda.</span></h1>
<p class="detail">Revisa cada sugerencia antes de añadirla.</p>
<div class="phone" style="position:absolute;left:390px;top:760px;width:860px;height:1818px;border-radius:137px;background:#050506;box-shadow:0 0 0 5px #2A2C31, 0 0 0 9px #8E939B, 0 0 0 12px #3B3E44, 0 55px 91px rgba(10,10,20,.28), 0 15px 22px rgba(10,10,20,.18)"><div style="position:absolute;left:-12px;top:300px;width:7px;height:64px;border-radius:4px;background:linear-gradient(90deg,#5d6168,#a3a8af 50%,#5d6168)"></div><div style="position:absolute;left:-12px;top:409px;width:7px;height:113px;border-radius:4px;background:linear-gradient(90deg,#5d6168,#a3a8af 50%,#5d6168)"></div><div style="position:absolute;left:-12px;top:545px;width:7px;height:113px;border-radius:4px;background:linear-gradient(90deg,#5d6168,#a3a8af 50%,#5d6168)"></div><div style="position:absolute;right:-12px;top:454px;width:7px;height:173px;border-radius:4px;background:linear-gradient(90deg,#5d6168,#a3a8af 50%,#5d6168)"></div><img src="../raw-es/proposal-travel.png" style="position:absolute;left:20px;top:20px;width:820px;height:1778px;border-radius:117px;display:block"></div><div class="zoom" style="left:60px;top:1645px;width:1020px;height:688px;background:url(../raw-es/proposal-travel.png) -27px -1211px/1074px 2328px no-repeat"></div><script>
// A headline line too long for the column shrinks both lines to the size that fits, so they stay even.
const lines = [...document.querySelectorAll('h1 span')];
let size = parseFloat(getComputedStyle(lines[0]).fontSize);
while (lines.some(l => l.scrollWidth > l.parentElement.clientWidth) && size > 60) { size -= 2; lines.forEach(l => l.style.fontSize = size + 'px'); }
</script></body></html>
